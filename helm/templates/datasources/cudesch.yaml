---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ragflow.fullname" . }}-datasource-cudesch
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  schedule: {{ .Values.datasource.cudesch.schedule | default "0 4 * * *" | quote }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 172800
      backoffLimit: 0
      template:
        spec:
          {{- if or .Values.imagePullSecrets .Values.ragflow.image.pullSecrets }}
          imagePullSecrets:
            {{- with .Values.imagePullSecrets }}
              {{- toYaml . | nindent 8 }}
              {{- end }}
              {{- with .Values.ragflow.image.pullSecrets }}
              {{- toYaml . | nindent 8 }}
              {{- end }}
          {{- end }}
          initContainers:
            - name: ensure-bucket
              image: minio/mc:latest
              envFrom:
                - secretRef:
                    name: {{ include "ragflow.fullname" . }}-cudesch-datasource-secrets
              env:
                - name: S3_ENDPOINT
                  value: {{ .Values.datasource.cudesch.s3Endpoint | default (printf "http://%s-minio:9000" (include "ragflow.fullname" .)) | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.datasource.cudesch.s3Bucket | quote }}
              command:
                - sh
                - -c
                - mc alias set target "$S3_ENDPOINT" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "target/$S3_BUCKET"
          containers:
            - name: datasync-cudesch
              image: {{ .Values.datasource.imageBase }}-cudesch
              imagePullPolicy: Always
              env:
                - name: CUDESCH_BASE_URL
                  value: {{ .Values.datasource.cudesch.baseUrl | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.datasource.cudesch.s3Endpoint | default (printf "http://%s-minio:9000" (include "ragflow.fullname" .)) | quote }}
                - name: S3_REGION
                  value: {{ .Values.datasource.cudesch.s3Region | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.datasource.cudesch.s3Bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.datasource.cudesch.s3Prefix | default "" | quote }}
              envFrom:
                - secretRef:
                    name: {{ include "ragflow.fullname" . }}-cudesch-datasource-secrets

          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          restartPolicy: Never
