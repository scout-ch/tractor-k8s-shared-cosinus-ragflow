---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ragflow.fullname" . }}-cudesch-datasource-secrets
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ .Values.datasource.cudesch.s3AccessKeyId | default .Values.minio.rootUser | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.datasource.cudesch.s3SecretAccessKey | default (.Values.minio.password | required "minio.password is required") | quote }}
  CUDESCH_API_TOKEN_DE: {{ .Values.datasource.cudesch.apiTokenDe | required "datasource.cudesch.apiTokenDe is required" | quote }}
  CUDESCH_API_TOKEN_FR: {{ .Values.datasource.cudesch.apiTokenFr | required "datasource.cudesch.apiTokenFr is required" | quote }}
  CUDESCH_API_TOKEN_IT: {{ .Values.datasource.cudesch.apiTokenIt | required "datasource.cudesch.apiTokenIt is required" | quote }}
