{{- range $name, $src := .Values.datasource.strapi }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ragflow.fullname" $ }}-datasource-{{ $name }}
  labels:
    {{- include "ragflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  schedule: {{ $src.schedule | default "45 * * * *" | quote }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200
      backoffLimit: 0
      template:
        spec:
          {{- if or $.Values.imagePullSecrets $.Values.ragflow.image.pullSecrets }}
          imagePullSecrets:
            {{- with $.Values.imagePullSecrets }}
              {{- toYaml . | nindent 8 }}
              {{- end }}
              {{- with $.Values.ragflow.image.pullSecrets }}
              {{- toYaml . | nindent 8 }}
              {{- end }}
          {{- end }}
          initContainers:
            - name: ensure-bucket
              image: minio/mc:latest
              envFrom:
                - secretRef:
                    name: {{ include "ragflow.fullname" $ }}-{{ $name }}-datasource-secrets
              env:
                - name: S3_ENDPOINT
                  value: {{ $src.s3Endpoint | default (printf "http://%s-minio:9000" (include "ragflow.fullname" $)) | quote }}
                - name: S3_BUCKET
                  value: {{ $src.s3Bucket | quote }}
              command:
                - sh
                - -c
                - mc alias set target "$S3_ENDPOINT" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "target/$S3_BUCKET"
          containers:
            - name: datasync-{{ $name }}
              image: {{ $.Values.datasource.imageBase }}-strapi
              imagePullPolicy: Always
              env:
                - name: STRAPI_BASE_URL
                  value: {{ $src.baseUrl | quote }}
                - name: STRAPI_API_VERSION
                  value: {{ $src.apiVersion | default "v4" | quote }}
                - name: SOURCE_DOCUMENT
                  value: {{ $name | quote }}
                - name: SOURCE_URL_TEMPLATE
                  value: {{ $src.sourceUrlTemplate | quote }}
                - name: S3_ENDPOINT
                  value: {{ $src.s3Endpoint | default (printf "http://%s-minio:9000" (include "ragflow.fullname" $)) | quote }}
                - name: S3_REGION
                  value: {{ $src.s3Region | quote }}
                - name: S3_BUCKET
                  value: {{ $src.s3Bucket | quote }}
                - name: S3_PREFIX
                  value: {{ $src.s3Prefix | default "" | quote }}
              envFrom:
                - secretRef:
                    name: {{ include "ragflow.fullname" $ }}-{{ $name }}-datasource-secrets

          {{- with $.Values.nodeSelector }}
          nodeSelector:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          restartPolicy: Never
{{- end }}
