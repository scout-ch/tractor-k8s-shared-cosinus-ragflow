# Dummy values for secret/config fields marked `required(...)` in the chart,
# so `helm lint`/`helm template` can render without the real secrets that
# `fluxcd/ragflow.yaml` normally injects via `valuesFrom`. Used by CI
# (.github/workflows/test.yml) and for local validation — see AGENTS.md.
minio:
  password: dummy
  accessKey: dummy
  secretKey: dummy
ragflow:
  secret_key: dummy
  ragflowApiKey: dummy
  storage:
    oauth:
      clientSecret: dummy
redis:
  password: dummy
elasticsearch:
  password: dummy
ingress:
  host: dummy.example.com
datasource:
  cudesch:
    apiTokenDe: dummy
    apiTokenFr: dummy
    apiTokenIt: dummy
